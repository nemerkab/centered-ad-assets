<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; }
body {
  background:
    radial-gradient(ellipse 70% 55% at 50% -10%, rgba(255,255,255,0.10), transparent 55%),
    radial-gradient(circle at 88% 72%, rgba(255,255,255,0.04), transparent 38%),
    radial-gradient(circle at 8% 85%, rgba(16,185,129,0.08), transparent 36%),
    #05050a;
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  padding: 80px;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.dots {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.11) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, #000 10%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, #000 10%, transparent 70%);
  pointer-events: none;
  opacity: 0.55;
}
.frame {
  position: absolute;
  inset: 40px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 28px;
  pointer-events: none;
}
.content {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  margin-top: auto;
  margin-bottom: auto;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.08);
  color: #ffffff;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 12px 22px;
  border-radius: 999px;
  margin-bottom: 42px;
}
.badge .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 12px rgba(255,255,255,0.55);
  flex-shrink: 0;
}
h1 {
  font-size: 104px;
  line-height: 0.98;
  font-weight: 800;
  letter-spacing: -0.04em;
  margin: 0 0 34px 0;
}
h1 span { display: block; }
h1 .grad {
  background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 60%, #525252 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
p {
  font-size: 30px;
  line-height: 1.4;
  color: rgba(255,255,255,0.55);
  font-weight: 500;
  max-width: 880px;
  margin: 0 0;
}
.cta {
  display: inline-flex;
  align-items: center;
  margin-top: 46px;
  background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 55%, #a3a3a3 100%);
  color: #05050a;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  padding: 20px 32px;
  border-radius: 999px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.45);
}
footer {
  position: relative;
  z-index: 1;
  width: 100%;
  margin-top: 52px;
  padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.10);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0;
}
.logo {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  line-height: 1;
}
.logo .word {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #ffffff;
}
.logo .sub {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.url {
  font-size: 22px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.02em;
}
.url strong { color: #ffffff; font-weight: 600; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="badge"><span class="dot"></span>For founders who built it themselves</div>
    <h1><span>Vibe-coded</span><span>MVP.</span><span>Production</span><span class="grad">next.</span></h1>
    <p>You got early traction with Cursor, Replit, or Lovable. We'll harden it for real users — without throwing away your progress.</p>
    <div class="cta">Apply →</div>
  </div>
  <footer>
    <div class="logo">
      <span class="word">centered</span>
      <span class="sub">Software</span>
    </div>
    <div class='url'><strong>/start/apply</strong></div>
  </footer>
</body>
</html>
